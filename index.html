<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Akan Name Generator</title>
<link rel="stylesheet" href="./styles.css">
</head>
<body>

    <div class="page-layout">

   <img src="images/Akan1.png" class="side-image">
   
    <div class="container">
    

        <h1>Akan Name Generator</h1>

        <p>
            Discover your traditional Akan name by entering your birth date and selecting your gender.
        </p>

 
    <form id="akanForm">

<label for="birthDate">Date of Birth</label>

<input
    type="date"
    id="birthDate"
    name="birthDate"
    required
>

<label for="gender">Gender</label>

<select id="gender" name="gender" required>

    <option value="">Select Gender</option>

    <option value="male">Male</option>

    <option value="female">Female</option>

</select>

<button type="submit">
    Generate Akan Name
</button>

        </form>

        <div id="result"></div>
    </div>
    <img src="images/Akan2.png" class="side-image">
</div>
    <script src="./script.js"></script>

</body>
</html>
